name: Build and release GUI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.17
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_gui: ${{ steps.check.outputs.has_gui }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check for GUI sources
        id: check
        run: |
          if [ -d gui ]; then
            echo "has_gui=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gui=false" >> "$GITHUB_OUTPUT"
            echo "No gui/ directory at this ref; skipping GUI release."
          fi

  release:
    needs: prepare
    if: needs.prepare.outputs.has_gui == 'true'
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Check version matches tag
        run: |
          version=$(python3 -c 'import json; print(json.load(open("gui/src-tauri/tauri.conf.json"))["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tauri.conf.json version v$version does not match tag $TAG"
            exit 1
          fi

      - name: Check signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build, sign and notarize
        working-directory: gui
        env:
          CI: true
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Verify signature and notarization
        working-directory: gui
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version=${TAG#v}
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/mactools.app"
          dmg="src-tauri/target/universal-apple-darwin/release/bundle/dmg/mactools_${version}_universal.dmg"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q "Developer ID Application"

          if ! xcrun stapler validate "$dmg" 2>/dev/null; then
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          fi

          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          dmg="gui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/mactools_${version}_universal.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --title "mactools $TAG" --generate-notes
          fi
