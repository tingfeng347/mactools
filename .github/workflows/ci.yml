name: Test mactools
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 only has an Intel macOS setup-python build.
          - os: macos-15-intel
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install terminal test dependencies on macOS
        run: brew list fzf fish >/dev/null 2>&1 || brew install fzf fish
      - name: Validate launchers using system Bash
        run: |
          for file in install.sh uninstall.sh bin/ma bin/maci bin/macr bin/macu bin/macd bin/macc bin/maco bin/macm bin/maca bin/mato; do /bin/bash -n "$file"; done
      - name: Isolated tests (no actual package installs)
        run: python3 -m unittest discover -s tests -v
